# 参考文档：
#   https://doris.apache.org/zh-CN/docs/install/cluster-deployment/run-docker-cluster
#   https://hub.docker.com/r/apache/doris

# 环境：Kylin Linux Advanced Server V10 x86_64 8核32G
# 镜像来源：从有网络的机器 docker save 导出，再 docker load 导入
# 默认配置可直接使用，无需修改

services:

  # ============================================================
  # Apache Doris FE（Frontend）
  #   职责：元数据管理、SQL 解析与查询规划、调度
  #   WebUI : http://宿主机IP:8030  默认账号 root / 空密码
  #   MySQL : 宿主机IP:9030
  # ============================================================
  doris-fe:
    image: apache/doris:fe-4.0.5
    container_name: doris-fe
    hostname: doris-fe
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # FE_SERVERS 格式：<fe名称>:<FE容器IP>:<edit_log_port>
      FE_SERVERS: "fe1:172.30.80.2:9010"
      FE_ID: 1
    ports:
      - "8030:8030"   # FE HTTP WebUI
      - "9030:9030"   # FE MySQL 协议（BI 工具 / mysql 客户端连接）
      - "9010:9010"   # FE Edit Log（集群内部）
      - "9020:9020"   # FE RPC（集群内部）
      - "9090:9090"   # Arrow Flight SQL（可选）
    volumes:
      - ./fe/conf/fe.conf:/opt/apache-doris/fe/conf/fe.conf:z
      - ./fe/doris-meta:/opt/apache-doris/fe/doris-meta:Z
      - ./fe/log:/opt/apache-doris/fe/log:z
    networks:
      doris-net:
        ipv4_address: 172.30.80.2
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # 资源限制：服务器 8核32G，FE 分配 4核8GB
    # JVM 堆 6GB（fe.conf 中 -Xmx6144m），留余量给堆外内存
    mem_limit: 8g
    cpus: 4
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8030/api/bootstrap | grep -q '\"code\":0'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ============================================================
  # Apache Doris BE（Backend）
  #   职责：数据存储 + 计算执行
  #   WebUI : http://宿主机IP:8040
  # ============================================================
  doris-be:
    image: apache/doris:be-4.0.5
    container_name: doris-be
    hostname: doris-be
    restart: unless-stopped
    depends_on:
      doris-fe:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      FE_SERVERS: "fe1:172.30.80.2:9010"
      BE_ADDR: "172.30.80.3:9050"
    ports:
      - "8040:8040"   # BE HTTP WebUI / Profile
      - "9050:9050"   # BE 心跳端口
      - "9060:9060"   # BE Thrift（FE <-> BE 通信）
      - "8060:8060"   # BE brpc（BE <-> BE 数据交换）
    volumes:
      - ./be/conf/be.conf:/opt/apache-doris/be/conf/be.conf:z
      - ./be/storage:/opt/apache-doris/be/storage:Z
      - ./be/log:/opt/apache-doris/be/log:z
    networks:
      doris-net:
        ipv4_address: 172.30.80.3
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      memlock:
        soft: -1
        hard: -1
    # 资源限制：服务器 8核32G，BE 分配 8核16GB
    # be.conf 中 mem_limit=12GB，留余量给堆外 + pagecache
    mem_limit: 16g
    cpus: 8
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8040/api/health | grep -qi 'ok'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

networks:
  doris-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.30.80.0/24
