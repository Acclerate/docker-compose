##====================================================================
## Apache Doris FE Configuration (Doris 4.0.5 / Linux Server)
## 适配：8核 32GB（FE 分配 4核 8GB）
##====================================================================

#------------ 元数据与日志 ------------
LOG_DIR = ${DORIS_HOME}/log
meta_dir = ${DORIS_HOME}/doris-meta

#------------ 网络绑定 ------------
# !!! 部署前根据服务器实际网络修改，需与 docker-compose.yml subnet 一致 !!!
priority_networks = 172.30.80.0/24

#------------ JVM 配置 ------------
# FE 分配 8GB，JVM 堆设 6GB，留 ~2GB 给堆外 / direct buffer
JAVA_OPTS = "-Xmx6144m -Xms4096m"

# For JDK 17+ (Doris 4.0 requires JDK 17)
JAVA_OPTS_FOR_JDK_17 = "-Xmx6144m -Xms4096m --add-opens=java.base/java.nio=ALL-UNNAMED"

#------------ 端口（与 docker-compose.yml ports 一一对应）------------
http_port = 8030
rpc_port = 9020
query_port = 9030
edit_log_port = 9010
arrow_flight_sql_port = 9090

#------------ 查询优化 ------------
# 单次查询最大内存 4GB
query_max_memory = 4294967296

#------------ 外部访问 ------------
enable_http_server_v2 = true

#------------ 日志级别 ------------
sys_log_level = INFO
