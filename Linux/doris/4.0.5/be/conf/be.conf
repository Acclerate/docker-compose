##====================================================================
## Apache Doris BE Configuration (Doris 4.0.5 / Linux Server)
## 适配：8核 32GB（BE 分配 8核 16GB）
##====================================================================

#------------ 数据与日志 ------------
LOG_DIR = ${DORIS_HOME}/log
storage_root_path = ${DORIS_HOME}/storage

#------------ 网络绑定 ------------
# !!! 部署前根据服务器实际网络修改，需与 docker-compose.yml subnet 一致 !!!
priority_networks = 172.30.80.0/24

#------------ 端口（与 docker-compose.yml ports 一一对应）------------
be_port = 9060
webserver_port = 8040
heartbeat_service_port = 9050
brpc_port = 8060

#------------ 内存限制 ------------
# Docker 分配 16GB 给 BE，mem_limit 设 12GB，留 ~4GB 给 OS / pagecache
mem_limit = 12884901888

#------------ 并发与线程 ------------
# 服务器 8 核，线程池按 8 核配置
tablet_map_shard_size = 8
default_num_parallel_load = 8
num_threads = 8

#------------ Compaction ------------
compaction_task_num_per_disk = 4
compaction_task_num_per_fast_disk = 4

#------------ 日志级别 ------------
sys_log_level = INFO
