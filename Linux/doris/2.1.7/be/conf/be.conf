#####################################################################
## BE 关键配置 - 针对 8核32G 环境优化
#####################################################################

# BE 监听的 IP 段（需与 Docker 网络 subnet 匹配）
priority_networks = 172.20.80.0/24

# 数据存储目录（支持多盘：/path1;/path2）
# 可追加磁盘类型：/path,SSD  /path,HDD
storage_root_path = /opt/apache-doris/be/storage

# 日志目录
sys_log_dir = /opt/apache-doris/be/log

# -------------------------------------------------------
# 端口配置
# -------------------------------------------------------
# BE Thrift 服务端口（FE 与 BE 通信）
be_port = 9060

# BE HTTP 端口（WebUI / Profile 查看）
webserver_port = 8040

# BE 心跳端口（FE 通过此端口探测 BE）
heartbeat_service_port = 9050

# brpc 端口（BE 间数据交换）
brpc_port = 8060

# -------------------------------------------------------
# 内存配置 — 8核32G 推荐 BE 使用 16GB
# -------------------------------------------------------
# BE 内存上限（硬限制），推荐为物理内存的 50%~80%
# 单位支持：B / K / KB / M / MB / G / GB / T / TB
mem_limit = 12GB

# 内存不足保留的系统内存，防止 OOM
low_watermark_level_percent = 10
high_watermark_level_percent = 15

# -------------------------------------------------------
# 线程与并发
# -------------------------------------------------------
# 扫描线程数（建议 = CPU 核心数 * 2）
doris_scanner_thread_pool_thread_num = 16

# Pipeline 执行线程数（建议 = CPU 核心数）
pipeline_executor_size = 8

# -------------------------------------------------------
# 存储与压缩
# -------------------------------------------------------
# 单次 Compaction 内存上限
total_permits_for_compaction_score = 10000

# 是否启用直接 IO（SSD 环境建议 true，HDD 建议 false）
enable_file_cache = false

# -------------------------------------------------------
# 日志级别
# -------------------------------------------------------
sys_log_level = INFO
