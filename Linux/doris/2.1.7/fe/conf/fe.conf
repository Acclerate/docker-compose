#####################################################################
## FE 关键配置 - 针对 8核32G 环境优化
#####################################################################

# FE 监听的 IP 段（需与 Docker 网络 subnet 匹配）
priority_networks = 172.20.80.0/24

# 元数据存储目录
meta_dir = /opt/apache-doris/fe/doris-meta

# 日志目录
LOG_DIR = /opt/apache-doris/fe/log

# HTTP 端口（WebUI）
http_port = 8030

# MySQL 协议查询端口
query_port = 9030

# RPC 端口（FE 间通信）
rpc_port = 9020

# FE 选主/同步日志端口
edit_log_port = 9010

# Arrow Flight SQL 端口（可选，供 BI 工具使用）
arrow_flight_sql_port = 9090

# -------------------------------------------------------
# JVM 内存配置 — 8核32G 推荐 FE 使用 8GB 堆
# -------------------------------------------------------
JAVA_OPTS = "-Xss4m -Xmx6144m -Xms4096m -XX:+UseMembar -XX:SurvivorRatio=8 \
  -XX:MaxTenuringThreshold=7 -XX:+PrintGCDateStamps -XX:+PrintGCDetails \
  -XX:+UseConcMarkSweepGC -XX:-CMSParallelRemarkEnabled \
  -XX:CMSInitiatingOccupancyFraction=80 -XX:SoftRefLRUPolicyMSPerMB=0 \
  -Xloggc:$DORIS_HOME/log/fe.gc.log.$CUR_DATE"

# Java 11+ 额外 JVM 参数
JAVA_OPTS_FOR_JDK_11 = "-Xss4m -Xmx6144m -Xms4096m -XX:+UseMembar \
  -XX:SurvivorRatio=8 -XX:MaxTenuringThreshold=7 \
  -XX:+PrintGCDateStamps -XX:+PrintGCDetails -XX:+UseG1GC \
  -Xloggc:$DORIS_HOME/log/fe.gc.log.$CUR_DATE"

# -------------------------------------------------------
# 并发与线程配置
# -------------------------------------------------------
# 查询线程池大小（建议 = CPU 核心数 * 4）
thrift_server_max_worker_threads = 4096

# 最大连接数
qe_max_connection = 1024

# -------------------------------------------------------
# 时区
# -------------------------------------------------------
# 通过环境变量 TZ 控制，此处注释保留
# time_zone = Asia/Shanghai
