server {
  listen       80;
  server_name  localhost;

  # 瓦片根目录列表
  location = /tiles_v/ {
    alias /data/tiles/;
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;
  }

  # zoom层级目录列表 (10/, 12/, 15/)
  location ~* ^/tiles_v/(\d+)/$ {
    alias /data/tiles/$1/;
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;
  }

  # col层级目录列表 (12/409/)
  location ~* ^/tiles_v/(\d+)/(\d+)/$ {
    alias /data/tiles/$1/$2/;
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;
  }

  # 矢量瓦片文件 (12/409/131)
  location ~* ^/tiles_v/(\d+)/(\d+)/(\d+)$ {
    alias /data/tiles/$1/$2/$3;
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header Access-Control-Allow-Origin "*";
    access_log off;
  }

  # 图片瓦片资源
  location ~* ^/tiles/(\d+)/(.*)$ {
    alias /data/tiles/$1/$2;
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header Access-Control-Allow-Origin "*";
    access_log off;
  }

  # 地图样式和配置文件
  location /static/offlinemap/ {
    root /usr/share/nginx/html;
    expires 7d;
    add_header Cache-Control "public";
    access_log off;
  }

  location / {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri $uri/ /index.html;
  }

  error_page   500 502 503 504  /50x.html;
  location = /50x.html {
    root   /usr/share/nginx/html;
  }
}
