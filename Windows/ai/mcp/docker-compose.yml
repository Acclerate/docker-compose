  # ==================== HTTP MCP 服务 (官方镜像，原生 HTTP 支持) ====================

# {
#   "mcpServers": {
#     "playwright": {
#       "type": "http",
#       "url": "http://localhost:18002/mcp"
#     }
#   }
# }

# docker-compose.yml
  playwright-mcp:
    image: mcr.microsoft.com/playwright/mcp
    container_name: playwright-mcp
    restart: always
    ports:
      - "18002:18002"
    environment:
      - PORT=18002
    entrypoint: ["node", "cli.js"]
    command: [
      "--headless",
      "--browser", "chromium",
      "--no-sandbox",
      "--port", "18002",
      "--host", "0.0.0.0",
      "--allowed-hosts", "*"
    ]
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "hostmachine:host-gateway"
