services:

  # ==================== 自建镜像 MCP 服务 ====================
  figma-mcp-server:
    image: figma-mcp-server
    build:
      context: .
      dockerfile: figma-mcp-server.Dockerfile
    stdin_open: true
    environment:
      - FIGMA_API_KEY=${FIGMA_API_KEY}
    command: [ "node", "index.js", "--stdio" ]
    restart: unless-stopped
    read_only: true
    user: "node"
    volumes:
      - figma-cache:/home/node/.cache

  # ==================== HTTP MCP 服务 (官方镜像，原生 HTTP 支持) ====================

  playwright-mcp:
    image: mcp/playwright:latest
    container_name: mcp-playwright
    restart: unless-stopped
    ports:
      - "${PLAYWRIGHT_MCP_PORT}:${PLAYWRIGHT_MCP_PORT}"
    environment:
      - PORT=${PLAYWRIGHT_MCP_PORT}
      - HOST=0.0.0.0
    # === 新增下面这部分 ===
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "hostmachine:host-gateway"
    # =====================
    command: --port ${PLAYWRIGHT_MCP_PORT} --host 0.0.0.0
  # MySQL MCP - 数据库操作 (192个工具)
  # 源码: https://github.com/neverinfamous/mysql-mcp
  # 镜像: https://hub.docker.com/r/writenotenow/mysql-mcp
  # 注意: 此服务由 Claude Code 直接通过 stdio 调用，不通过 docker-compose 管理
  # 运行方式: docker run -i --rm -e MYSQL_CONNECTION=mysql://root:root@host.docker.internal:3306 writenotenow/mysql-mcp:latest --mysql mysql://root:root@host.docker.internal:3306 --transport stdio

  # ==================== stdio MCP 服务说明 ====================
  # 以下 stdio 服务由 Claude Code 直接通过 docker run 管理，不在此文件中配置:
  # - Memory MCP: mcp/memory:latest
  # - Sequential-thinking MCP: mcp/sequentialthinking:latest

volumes:
  figma-cache:
  memory-data:
