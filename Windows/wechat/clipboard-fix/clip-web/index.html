<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微信图片粘贴</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f0f2f5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #333;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,.08);
    padding: 40px;
    width: 480px;
    max-width: 92vw;
    text-align: center;
  }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
  .sub { font-size: 13px; color: #888; margin-bottom: 28px; line-height: 1.6; }
  .drop-zone {
    border: 2px dashed #c8d0dd;
    border-radius: 12px;
    padding: 36px 20px;
    margin-bottom: 18px;
    cursor: pointer;
    transition: all .2s;
    background: #fafbfc;
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: #07c160;
    background: #f0fcf5;
  }
  .drop-zone .icon { font-size: 36px; margin-bottom: 8px; }
  .drop-zone .hint { font-size: 14px; color: #555; }
  .drop-zone .small { font-size: 12px; color: #aaa; margin-top: 6px; }
  .btn {
    background: #07c160;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px 28px;
    font-size: 15px;
    cursor: pointer;
    width: 100%;
    transition: background .15s;
  }
  .btn:hover { background: #06ad56; }
  .btn:disabled { background: #bbb; cursor: not-allowed; }
  .status {
    margin-top: 16px;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    display: none;
    line-height: 1.6;
  }
  .status.ok    { display: block; background: #f0fcf5; color: #07a050; }
  .status.err   { display: block; background: #fff0f0; color: #d33; }
  .status.work  { display: block; background: #f5f8ff; color: #2468f2; }
  .preview { margin-top: 14px; max-width: 100%; max-height: 200px; border-radius: 8px; display: none; }
  .steps { margin-top: 22px; font-size: 12px; color: #999; line-height: 1.8; text-align: left; }
  .steps b { color: #555; }
  kbd { background: #eee; border-radius: 4px; padding: 1px 6px; font-family: Consolas, monospace; font-size: 12px; }
</style>
</head>
<body>
<div class="card">
  <h1>📤 微信图片粘贴</h1>
  <div class="sub">截图后点按钮，或拖拽图片到这里，然后在微信按 <kbd>Ctrl+V</kbd></div>

  <div class="drop-zone" id="dropZone">
    <div class="icon">🖼️</div>
    <div class="hint">拖拽图片到这里，或点击选择文件</div>
    <div class="small">截图后也可点下方按钮直接读取剪贴板</div>
    <input type="file" id="fileInput" accept="image/*" hidden>
  </div>

  <button class="btn" id="pasteBtn">📋 发送系统剪贴板里的图片</button>

  <div class="status" id="status"></div>
  <img class="preview" id="preview" alt="预览">

  <div class="steps">
    <b>使用：</b><br>
    1. <kbd>Win</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd> 截图，或复制一张图片<br>
    2. 点上方按钮（或拖拽图片到方框）<br>
    3. 切到微信输入框，按 <kbd>Ctrl</kbd>+<kbd>V</kbd> 发送
  </div>
</div>

<script>
const statusEl = document.getElementById('status');
const previewEl = document.getElementById('preview');
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');

function setStatus(type, msg) {
  statusEl.className = 'status ' + type;
  statusEl.innerHTML = msg;
}
function showPreview(blob) {
  previewEl.src = URL.createObjectURL(blob);
  previewEl.style.display = 'block';
}

async function sendImage(blob, name) {
  setStatus('work', '⏳ 正在发送到微信剪贴板...');
  try {
    const fd = new FormData();
    fd.append('image', blob, name || 'clip.png');
    const r = await fetch('/clip/send', { method: 'POST', body: fd });
    const data = await r.json();
    if (r.ok && data.ok) {
      let msg = '✅ 已复制到剪贴板 (' + (data.bytes||'?') + ' bytes)<br>👉 现在切到微信，按 <kbd>Ctrl+V</kbd> 粘贴';
      if (data.saved) {
        msg += '<br>💾 已存档到：<code>' + data.saved + '</code>';
      }
      setStatus('ok', msg);
    } else {
      setStatus('err', '❌ ' + (data.error || '未知错误'));
    }
  } catch (e) {
    setStatus('err', '❌ 请求失败：' + e.message);
  }
}

document.getElementById('pasteBtn').addEventListener('click', async () => {
  setStatus('work', '⏳ 读取剪贴板...');
  try {
    const items = await navigator.clipboard.read();
    for (const item of items) {
      for (const type of item.types) {
        if (type.startsWith('image/')) {
          const blob = await item.getType(type);
          showPreview(blob);
          await sendImage(blob, 'clip.' + type.split('/')[1]);
          return;
        }
      }
    }
    setStatus('err', '❌ 剪贴板里没有图片。<br>请先用 Win+Shift+S 截图或复制一张图片。');
  } catch (e) {
    setStatus('err', '❌ 无法读取剪贴板：' + e.message + '<br>请允许剪贴板权限，或改用拖拽图片方式。');
  }
});

['dragenter', 'dragover'].forEach(ev =>
  dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add('dragover'); })
);
['dragleave', 'drop'].forEach(ev =>
  dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.remove('dragover'); })
);
dropZone.addEventListener('drop', e => {
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) { showPreview(f); sendImage(f, f.name); }
  else { setStatus('err', '❌ 只支持图片文件'); }
});

dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  const f = fileInput.files[0];
  if (f) { showPreview(f); sendImage(f, f.name); }
});
</script>
</body>
</html>
