##====================================================================
## Apache Doris BE Configuration (Doris 4.0.5 / Windows Docker Desktop)
## 适配：8核(分配) / 23.5GB Docker / 宿主机 32GB
##====================================================================

#------------ 数据与日志 ------------
LOG_DIR = ${DORIS_HOME}/log
# BE 数据存储目录（容器内路径，已通过 volume 持久化到宿主机）
storage_root_path = ${DORIS_HOME}/storage

#------------ 网络绑定 ------------
# 与 docker-compose.yml 中 subnet 对应
priority_networks = 172.28.81.0/24

#------------ 端口（与 docker-compose.yml ports 一一对应）------------
be_port = 9060
webserver_port = 8040
heartbeat_service_port = 9050
brpc_port = 8060

#------------ 内存限制 ------------
# Docker 分配 12GB 给 BE，mem_limit 设 8GB，留 ~4GB 给 OS / pagecache
mem_limit = 8589934592

#------------ 并发与线程 ------------
# Docker 分配 6 核，线程池按 6 核配置
tablet_map_shard_size = 8
default_num_parallel_load = 6
num_threads = 6

#------------ Compaction ------------
# 开发环境适当降低 compaction 并发，减少资源争用
compaction_task_num_per_disk = 2
compaction_task_num_per_fast_disk = 2

#------------ 日志级别 ------------
sys_log_level = INFO
priority_networks = 172.28.81.0/24
