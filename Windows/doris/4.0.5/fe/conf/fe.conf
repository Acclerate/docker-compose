##====================================================================
## Apache Doris FE Configuration (Doris 4.0.5 / Windows Docker Desktop)
## 适配：8核(分配) / 23.5GB Docker / 宿主机 32GB
##====================================================================

#------------ 元数据与日志 ------------
LOG_DIR = ${DORIS_HOME}/log
# 元数据目录（容器内路径，已通过 volume 持久化到宿主机）
meta_dir = ${DORIS_HOME}/doris-meta

#------------ 网络绑定 ------------
# 与 docker-compose.yml 中 subnet 对应
priority_networks = 172.28.81.0/24

#------------ JVM 配置 ------------
# Docker 分配 6GB 给 FE，JVM 堆设 4GB，留 ~2GB 给堆外 / direct buffer
JAVA_OPTS = "-Xmx4096m -Xms2048m"

# For JDK 17+ (Doris 4.0 requires JDK 17)
JAVA_OPTS_FOR_JDK_17 = "-Xmx4096m -Xms2048m --add-opens=java.base/java.nio=ALL-UNNAMED"

#------------ 端口（与 docker-compose.yml ports 一一对应）------------
http_port = 8030
rpc_port = 9020
query_port = 9030
edit_log_port = 9010
arrow_flight_sql_port = 9090

#------------ 查询优化 ------------
# 单次查询最大内存 2GB（开发环境足够）
query_max_memory = 2147483648

#------------ 外部访问 ------------
# 允许所有 IP 连接（开发环境）
enable_http_server_v2 = true

#------------ 日志级别 ------------
# INFO 适合日常使用，排查问题时改为 DEBUG
sys_log_level = INFO
priority_networks = 172.28.81.0/24
priority_networks = 172.28.81.0/24
priority_networks = 172.28.81.0/24
priority_networks = 172.28.81.0/24
priority_networks = 172.28.81.0/24
