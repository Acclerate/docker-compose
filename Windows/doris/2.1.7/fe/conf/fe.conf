#####################################################################
## FE 关键配置 - 针对 Windows 11 Docker Desktop (8核23.5G) 优化
#####################################################################

# FE 监听的 IP 段（需与 Docker 网络 subnet 匹配）
priority_networks = 172.20.81.0/24

# 元数据存储目录
meta_dir = /opt/apache-doris/fe/doris-meta

# 日志目录
LOG_DIR = /opt/apache-doris/fe/log

# HTTP 端口（WebUI）
http_port = 8030

# MySQL 协议查询端口
query_port = 9030

# RPC 端口（FE 间通信）
rpc_port = 9020

# FE 选主/同步日志端口
edit_log_port = 9010

# Arrow Flight SQL 端口（可选，供 BI 工具使用）
arrow_flight_sql_port = 9090

# -------------------------------------------------------
# JVM 内存配置 — Docker Desktop 8核23.5G，FE 分配 6GB 容器
# JVM 堆设 4GB，留 2GB 给堆外（Netty、NIO、元数据等）
# -------------------------------------------------------
JAVA_OPTS = "-Xss4m -Xmx4096m -Xms2048m -XX:+UseMembar -XX:SurvivorRatio=8 \
  -XX:MaxTenuringThreshold=7 -XX:+PrintGCDateStamps -XX:+PrintGCDetails \
  -XX:+UseConcMarkSweepGC -XX:-CMSParallelRemarkEnabled \
  -XX:CMSInitiatingOccupancyFraction=80 -XX:SoftRefLRUPolicyMSPerMB=0 \
  -Xloggc:$DORIS_HOME/log/fe.gc.log.$CUR_DATE"

# Java 11+ 额外 JVM 参数（Doris 2.1.7 默认使用 Java 11+）
JAVA_OPTS_FOR_JDK_11 = "-Xss4m -Xmx4096m -Xms2048m -XX:+UseMembar \
  -XX:SurvivorRatio=8 -XX:MaxTenuringThreshold=7 \
  -XX:+PrintGCDateStamps -XX:+PrintGCDetails -XX:+UseG1GC \
  -Xloggc:$DORIS_HOME/log/fe.gc.log.$CUR_DATE"

# -------------------------------------------------------
# 并发与线程配置 — FE 分配 2 核
# -------------------------------------------------------
# 查询线程池大小
thrift_server_max_worker_threads = 2048

# 最大连接数
qe_max_connection = 512

# -------------------------------------------------------
# 元数据与日志保留
# -------------------------------------------------------
# 编辑日志保留时间（小时）
edit_log_roll_num = 50000

# 元数据垃圾清理间隔（秒）
metadata_failure_recovery = false
