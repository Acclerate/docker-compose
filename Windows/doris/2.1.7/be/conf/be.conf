#####################################################################
## BE 关键配置 - 针对 Windows 11 Docker Desktop (8核23.5G) 优化
#####################################################################

# BE 监听的 IP 段（需与 Docker 网络 subnet 匹配）
priority_networks = 172.20.81.0/24

# 数据存储目录
storage_root_path = /opt/apache-doris/be/storage

# 日志目录
sys_log_dir = /opt/apache-doris/be/log

# -------------------------------------------------------
# 端口配置
# -------------------------------------------------------
be_port = 9060
webserver_port = 8040
heartbeat_service_port = 9050
brpc_port = 8060

# -------------------------------------------------------
# 内存配置 — Docker Desktop 8核23.5G，BE 分配 12GB 容器
# BE 进程内存上限设 8GB，留 4GB 给系统 + pagecache + 堆外
# -------------------------------------------------------
mem_limit = 8GB

# 内存水位线（百分比）
low_watermark_level_percent = 10
high_watermark_level_percent = 15

# -------------------------------------------------------
# 线程与并发 — BE 分配 6 核
# -------------------------------------------------------
# 扫描线程数（= CPU 核心数 * 2）
doris_scanner_thread_pool_thread_num = 12

# Pipeline 执行线程数（= CPU 核心数）
pipeline_executor_size = 6

# -------------------------------------------------------
# 存储与 Compaction
# -------------------------------------------------------
total_permits_for_compaction_score = 10000

# 文件缓存（Docker Desktop 环境建议关闭，避免额外 IO 开销）
enable_file_cache = false

# -------------------------------------------------------
# 日志级别
# -------------------------------------------------------
sys_log_level = INFO
