# 基于 Nacos 2.3.2 官方默认 application.properties
# (https://github.com/alibaba/nacos/blob/2.3.2/distribution/conf/application.properties)
#
# 本文件挂载到容器 /home/nacos/conf/application.properties 覆盖镜像默认配置。
# 相比 1.4.1 的关键差异：
#   1) 鉴权密钥属性名从 nacos.core.auth.default.token.secret.key
#      改为 nacos.core.auth.plugin.nacos.token.secret.key（2.2.0+ 必须显式配置，否则启动报错）；
#   2) 新增 server.identity 鉴权白名单（1.4.1+ 必须，默认值会被视为高危漏洞）；
#   3) 持久化推荐用 spring.sql.init.platform=mysql（spring.datasource.platform 已 deprecated）。

### Spring Boot 相关 ###
server.servlet.contextPath=/nacos
server.error.include-message=ALWAYS
server.port=${NACOS_APPLICATION_PORT:8848}

### 网络相关 ###
nacos.inetutils.prefer-hostname-over-ip=false
nacos.inetutils.ip-address=

### 配置模块 - MySQL 持久化 ###
# 若使用默认 Derby 内嵌库，把下面 5 行注释掉即可。
spring.datasource.platform=${SPRING_DATASOURCE_PLATFORM:mysql}
spring.sql.init.platform=${SPRING_DATASOURCE_PLATFORM:mysql}
db.num=${MYSQL_DATABASE_NUM:1}
db.url.0=jdbc:mysql://${MYSQL_SERVICE_HOST:127.0.0.1}:${MYSQL_SERVICE_PORT:3306}/${MYSQL_SERVICE_DB_NAME:nacos}?${MYSQL_SERVICE_DB_PARAM:characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
db.user.0=${MYSQL_SERVICE_USER:nacos}
db.password.0=${MYSQL_SERVICE_PASSWORD:nacos}
# HikariCP 连接池
db.pool.config.connectionTimeout=30000
db.pool.config.validationTimeout=10000
db.pool.config.maximumPoolSize=20
db.pool.config.minimumIdle=2
# 推送最大重试次数
nacos.config.push.maxRetryTime=50

### 命名模块 ###
nacos.naming.data.warmup=true
nacos.naming.expireInstance=true
nacos.naming.clean.empty-service.interval=60000
nacos.naming.clean.empty-service.expired-time=60000
nacos.naming.clean.expired-metadata.interval=5000
nacos.naming.clean.expired-metadata.expired-time=60000
nacos.naming.push.pushTaskDelay=500
nacos.naming.push.pushTaskTimeout=5000
nacos.naming.push.pushTaskRetryDelay=1000
nacos.naming.client.expired.time=180000

### CMDB 模块 ###
nacos.cmdb.dumpTaskInterval=3600
nacos.cmdb.eventTaskInterval=10
nacos.cmdb.labelTaskInterval=300
nacos.cmdb.loadDataAtStart=false

### Tomcat 指标与访问日志 ###
server.tomcat.mbeanregistry.enabled=true
management.endpoints.web.exposure.include=prometheus,health
management.metrics.export.elastic.enabled=false
management.metrics.export.influx.enabled=false
server.tomcat.accesslog.enabled=${TOMCAT_ACCESSLOG_ENABLED:false}
server.tomcat.accesslog.rotate=true
server.tomcat.accesslog.file-date-format=.yyyy-MM-dd-HH
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b %D %{User-Agent}i %{Request-Source}i
server.tomcat.basedir=file:.

### 鉴权（必须）###
# 与 ShenYu 2.6.1 对接时必须开启，且 admin/bootstrap 与业务服务 username/password 保持一致。
spring.security.enabled=false
nacos.security.ignore.urls=/,/error,/**/*.css,/**/*.js,/**/*.html,/**/*.map,/**/*.svg,/**/*.png,/**/*.ico,/console-ui/public/**,/v1/auth/**,/v1/console/health/**,/actuator/**,/v1/console/server/**
nacos.core.auth.system.type=nacos
# 开启鉴权（默认 true，docker-compose 中由 NACOS_AUTH_ENABLE 覆盖）
nacos.core.auth.enabled=${NACOS_AUTH_ENABLE:true}
nacos.core.auth.caching.enabled=true
# 1.4.1+ 关闭 user-agent 白名单
nacos.core.auth.enable.userAgentAuthWhite=false
# 服务端身份标识（集群所有节点必须一致；默认值与 ShenYu 链路对齐，可用环境变量覆盖）
nacos.core.auth.server.identity.key=${NACOS_AUTH_IDENTITY_KEY:shenyu-nacos}
nacos.core.auth.server.identity.value=${NACOS_AUTH_IDENTITY_VALUE:shenyu-nacos-2026}
# JWT 密钥（Base64 编码，原始长度 ≥ 32 字符；默认值为自定义密钥，禁止使用官方默认 SecretKey0123... ）
nacos.core.auth.plugin.nacos.token.cache.enable=false
nacos.core.auth.plugin.nacos.token.expire.seconds=${NACOS_AUTH_TOKEN_EXPIRE_SECONDS:18000}
nacos.core.auth.plugin.nacos.token.secret.key=${NACOS_AUTH_TOKEN:VGhpc0lzTXlDdXN0b21TZWNyZXRLZXkwMTIzNDU2Nzg=}

### 控制插件 ###
nacos.plugin.control.manager.type=nacos
nacos.plugin.control.rule.local.basedir=${nacos.home}
nacos.plugin.control.rule.external.storage=

### 配置变更插件 ###
nacos.core.config.plugin.webhook.enabled=false
nacos.core.config.plugin.webhook.url=
nacos.core.config.plugin.webhook.contentMaxCapacity=102400
nacos.core.config.plugin.whitelist.enabled=false
nacos.core.config.plugin.whitelist.suffixs=xml,text,properties,yaml,html
nacos.core.config.plugin.fileformatcheck.enabled=false

### Istio ###
nacos.istio.mcp.server.enabled=false

### Core ###
nacos.core.snowflake.worker-id=
nacos.core.member.lookup.type=[file,address-server]
nacos.core.address-server.retry=5
address.server.domain=jmenv.tbsite.net
address.server.port=8080
address.server.url=/nacos/serverlist

### JRaft ###
nacos.core.protocol.raft.data.election_timeout_ms=5000
nacos.core.protocol.raft.data.snapshot_interval_secs=30
nacos.core.protocol.raft.data.core_thread_num=8
nacos.core.protocol.raft.data.cli_service_thread_num=4
nacos.core.protocol.raft.data.read_index_type=ReadOnlySafe
nacos.core.protocol.raft.data.rpc_request_timeout_ms=5000

### Distro ###
nacos.core.protocol.distro.data.sync.delayMs=1000
nacos.core.protocol.distro.data.sync.timeoutMs=3000
nacos.core.protocol.distro.data.sync.retryDelayMs=3000
nacos.core.protocol.distro.data.verify.intervalMs=5000
nacos.core.protocol.distro.data.verify.timeoutMs=3000
nacos.core.protocol.distro.data.load.retryDelayMs=30000
nacos.prometheus.metrics.enabled=true

### gRPC（Since 2.3）###
nacos.remote.server.grpc.sdk.max-inbound-message-size=10485760
nacos.remote.server.grpc.sdk.keep-alive-time=7200000
nacos.remote.server.grpc.sdk.keep-alive-timeout=20000
nacos.remote.server.grpc.sdk.permit-keep-alive-time=300000
nacos.remote.server.grpc.cluster.max-inbound-message-size=10485760
nacos.remote.server.grpc.cluster.keep-alive-time=7200000
nacos.remote.server.grpc.cluster.keep-alive-timeout=20000
nacos.remote.server.grpc.cluster.permit-keep-alive-time=300000

### 控制台 ###
nacos.console.ui.enabled=true
