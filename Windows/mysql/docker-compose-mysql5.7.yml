version: '3'
services:
  mysql57:
    image: mysql:5.7
    container_name: mysql57
    restart: unless-stopped
    command:
      - "--server-id=3306"
      - "--log-bin=/var/lib/mysql/mysql-bin"
      - "--binlog_format=ROW"
      - "--binlog_row_image=FULL"
      - "--expire_logs_days=7"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_general_ci"
    volumes:
      - "D:/DockerFiled/MySQL57/data:/var/lib/mysql"
      - "./mysql5.7/log/mysql/error.log:/var/log/mysql/error.log"
      - "./mysql5.7/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d"
    environment:
      TZ: Asia/Shanghai
      LANG: en_US.UTF-8
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"