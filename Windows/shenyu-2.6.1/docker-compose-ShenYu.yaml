# 参考文档：https://shenyu.apache.org/zh/docs/deployment/deployment-docker-compose
# 版本：2.6.1 (JDK 8 + Spring Boot 2.5.x)
# 说明：
#   1. 本编排仅启动 shenyu-admin + shenyu-bootstrap，不启动 MySQL；
#   2. 数据源复用已存在的 MySQL 容器（mysql57，MySQL 5.7，root/root，见 Windows/mysql 下编排）。
#      通过外部网络 mysql_default 用容器名 mysql57:3306 直连。
#   3. 库名用 shenyu_261（与 shenyu-2.7.0.3 的 shenyu 库隔离），首次启动前需手动导入 schema
#      （见 run.md）。shenyu.database.init_enable=true 仅对 h2 生效，mysql 需手动建表。
#   4. 与 Windows/shenyu（2.7.0.3）并存：容器名 -261 后缀、端口 9096/9196、独立网络 shenyu_net_261。
version: "3"
services:
  shenyu-admin:
    image: apache/shenyu-admin:2.6.1
    container_name: shenyu-admin-261
    restart: unless-stopped
    ports:
      - "9096:9095"   # 与 2.7.0.3 的 9095 错开，可并存
    volumes:
      - "./shenyu-admin/conf:/opt/shenyu-admin/conf"
      - "./shenyu-admin/logs:/opt/shenyu-admin/logs"
      - "./shenyu-admin/ext-lib:/opt/shenyu-admin/ext-lib"  # 挂载 mysql-connector.jar
    environment:
      - TZ=Asia/Shanghai
      # 显式指定 mysql profile (镜像内 application.yml 默认是 h2，conf/application.yml 已改 mysql，
      # 此处再显式指定，双保险)
      - SPRING_PROFILES_ACTIVE=mysql
      # 管理后台前端登录依赖首页注入的 httpPath 作为 API baseURL。
      # 默认用容器内网 IP (172.x.x.x)，宿主机浏览器无法访问会登录失败/超时。
      # 设 shenyu.httpPath="." 让前端走相对路径 (Yo = httpPath || "." => ".")，
      # 请求自动使用浏览器当前访问的 host，本机/远程访问都正常。
      # entrypoint.sh 读 ADMIN_JVM 作为 JVM 参数 (为空时用默认内存参数；非空则完全替换，故需带上内存参数)。
      - ADMIN_JVM=-server -Xmx2g -Xms2g -Xmn1g -Xss328k -Dshenyu.httpPath=.
    # 2.6.1 用镜像默认 entrypoint.sh（["/bin/sh","entrypoint.sh"]），无需覆盖。
    # 与 2.7.0.3 不同：2.6.1 基于 Spring Boot 2.x，entrypoint 把 ext-lib 加入 -classpath 后，
    # 传统 classloader 会正常扫描并加载 mysql 驱动，不需要像 2.7 那样把 ext-lib/*.jar 复制到 lib/。
    networks:
      - default
      - mysql_net  # 接入 mysql_default 以解析容器名 mysql57
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9095/actuator/health | grep UP || exit 1"]
      timeout: 5s
      retries: 30
      start_period: 120s

  shenyu-bootstrap:
    image: apache/shenyu-bootstrap:2.6.1
    container_name: shenyu-bootstrap-261
    restart: unless-stopped
    ports:
      - "9196:9195"   # 与 2.7.0.3 的 9195 错开，可并存
    volumes:
      - "./shenyu-bootstrap/conf:/opt/shenyu-bootstrap/conf"
      - "./shenyu-bootstrap/logs:/opt/shenyu-bootstrap/logs"
      - "./shenyu-bootstrap/ext-lib:/opt/shenyu-bootstrap/ext-lib"
    environment:
      - TZ=Asia/Shanghai
      # websocket urls 已在 conf/application.yml 指向 ws://shenyu-admin-261:9095/websocket，
      # 这里再用环境变量覆盖一次，确保走容器名与 admin 建立同步（双保险）。
      - shenyu.sync.websocket.urls=ws://shenyu-admin-261:9095/websocket
      - GW_SIGN_KEY_SOURCE=redis
      - GW_SIGN_REDIS_HOST=host.docker.internal
      - GW_SIGN_REDIS_PORT=6379
      - GW_SIGN_REDIS_DATABASE=0
      - GW_SIGN_REDIS_PASSWORD=123456
      - GW_SIGN_REDIS_TIMEOUT_MS=1500
      - GW_SIGN_REDIS_BIZ_PUBLIC_KEY_PATTERN=shenyu:sign:%s:biz-public-key.pem
      - GW_SIGN_CACHE_TTL_SECONDS=30
      - GW_SIGN_CACHE_FAILURE_RETRY_SECONDS=3
      - GW_SIGN_CACHE_ALLOW_STALE_ON_REFRESH_FAILURE=true
    depends_on:
      shenyu-admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9195/actuator/health"]
      timeout: 5s
      retries: 30
      start_period: 90s


networks:
  default:                          # shenyu-admin-261 与 shenyu-bootstrap-261 互通用
    name: shenyu_net_261             # 与 2.7.0.3 的 shenyu_net 隔离
  mysql_net:                        # 复用已存在的 mysql 网络以连接 mysql57
    name: mysql_default
    external: true
